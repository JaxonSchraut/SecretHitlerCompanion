<!--
  SECRET ROLE DEALER — a single-device "pass and reveal" companion for
  Secret Hitler (an homage; uses its rules, not its artwork/logo).

  HOW IT WORKS
  ------------
  One phone is passed around the table. Each player privately holds to reveal
  their role, memorizes it, and passes on. No server, no accounts — everything
  lives in this one file, in memory. Refreshing wipes the game (by design:
  nothing sensitive is ever stored).

  WHERE TO EXTEND
  ---------------
  - ROLE_TABLE / dealRoles(): the game's rules live here.
  - The `screen` state machine at the bottom drives the whole flow.
  - To go multi-device later, keep dealRoles() as-is and move it server-side;
    push each player's `intel` object to their own phone instead of paging
    through them on one screen.

  Secret Hitler is licensed CC BY–NC–SA 4.0 by its creators. This companion
  is non-commercial and reproduces none of its art or trademarks.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Secret Role Dealer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#14110d;          /* warm near-black base            */
    --ink-2:#1f1a14;        /* raised panels                   */
    --bone:#ece3d0;         /* paper / primary text            */
    --bone-dim:#9c9484;     /* muted text                      */
    --vermilion:#e23b2e;    /* fascist / danger / primary CTA  */
    --amber:#f2a417;        /* highlight, stamps               */
    --liberal:#2f6f8f;      /* liberal party                   */
    --line:#3a332a;         /* hairlines                       */
    --shadow:0 18px 40px -18px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--bone);
    font-family:"Archivo",system-ui,sans-serif;
    overflow:hidden;
    /* subtle constructivist rays behind everything */
    background-image:
      repeating-conic-gradient(from 0deg at 50% -10%,
        rgba(242,164,23,.05) 0deg 8deg, transparent 8deg 16deg);
  }
  .app{
    height:100dvh; height:100vh;
    max-width:520px; margin:0 auto;
    display:flex; flex-direction:column;
    padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));
  }
  .screen{flex:1; display:flex; flex-direction:column; animation:rise .35s ease both}
  /* Setup has up to 10 name fields plus headers/button — on a short phone
     screen that's taller than the viewport, so it needs to scroll instead
     of silently clipping the bottom fields (and the Deal button) off-screen.
     min-height:0 overrides the flex-item default of never shrinking below
     content size, which is what would otherwise defeat overflow-y here. */
  .screen.scroll{overflow-y:auto; min-height:0; -webkit-overflow-scrolling:touch}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none}}

  .eyebrow{
    font-family:"Anton",sans-serif; letter-spacing:.22em; text-transform:uppercase;
    font-size:12px; color:var(--amber);
  }
  h1{font-family:"Anton",sans-serif; text-transform:uppercase; line-height:.92; letter-spacing:.01em}
  .wordmark{font-size:clamp(38px,13vw,62px)}
  .wordmark .rule{display:block; height:5px; width:64px; background:var(--vermilion); margin-top:14px}

  .stack{display:flex; flex-direction:column; gap:14px}
  .grow{flex:1}
  .center{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px}

  /* buttons */
  button{font-family:inherit; cursor:pointer; border:none; font-weight:900}
  .btn{
    background:var(--vermilion); color:var(--bone);
    padding:18px; font-size:19px; text-transform:uppercase; letter-spacing:.06em;
    border-radius:2px; box-shadow:var(--shadow); transition:transform .1s;
  }
  .btn:active{transform:translateY(2px)}
  .btn.ghost{background:transparent; color:var(--bone); border:2px solid var(--line)}
  .btn.amber{background:var(--amber); color:var(--ink)}
  .btn:disabled{opacity:.4; cursor:default}

  .label{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--bone-dim)}

  /* pass screen */
  .emblem{
    width:132px; height:132px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, var(--ink-2), var(--ink));
    border:3px solid var(--amber); position:relative;
  }
  .emblem::before{
    content:""; position:absolute; inset:-14px; border-radius:50%;
    border:2px dashed var(--line);
  }
  .emblem b{font-family:"Anton",sans-serif; font-size:54px; color:var(--amber)}
  .who{font-family:"Anton",sans-serif; font-size:clamp(30px,9vw,46px); text-transform:uppercase}

  /* hold-to-reveal */
  .holdpad{
    position:relative; flex:1; border:2px solid var(--line); border-radius:3px;
    background:var(--ink-2);
    display:flex; align-items:center; justify-content:center; text-align:center;
    overflow:hidden; user-select:none; touch-action:none;
  }
  .fill{position:absolute; inset:0; background:var(--vermilion); transform:scaleY(0); transform-origin:bottom; transition:transform .05s linear}
  .holdpad .hint{position:relative; z-index:2; padding:24px}
  .holdpad .hint b{font-family:"Anton"; font-size:22px; letter-spacing:.04em}
  .holdpad .hint span{display:block; margin-top:8px; color:var(--bone-dim); font-size:14px}

  /* role card
     Deliberately the SAME neutral background on every card, regardless of
     team or outcome. A full-bleed red/blue background can reflect off a
     player's face or glasses and tip off anyone glancing over — team is
     signaled only by the small tinted sigil below, never by screen color. */
  .card{
    flex:1; border-radius:3px; padding:26px; display:flex; flex-direction:column;
    box-shadow:var(--shadow); border:3px solid rgba(0,0,0,.25);
    background:linear-gradient(160deg,#2a2118,#14110d); color:var(--bone);
  }
  /* sigilSvg() bakes the liberal/fascist tint directly into the PNG pixels
     (see process_sigils.py) — a plain <img> ignores CSS `color`, so unlike
     the old inline-SVG version there's no currentColor tinting to do here.
     Both *-tinted.png are square-canvas, content-cropped, and resized to
     the same 400x400, so a single width/height here renders both sigils
     genuinely round and genuinely the same size — no per-team override,
     no dependence on object-fit letterboxing an off-ratio source image. */
  .sigil{width:64px; height:64px; margin:0 auto 14px; flex-shrink:0; align-self:center; object-fit:contain}
  .sigil.hero{width:120px; height:120px}
  /* .sigil-slot fills whatever vertical space is left over between the
     team/role/stamp block (which stays at the top) and .intel (which stays
     pinned at the bottom via its own margin-top:auto) and centers the
     sigil within THAT space specifically — not the card's raw 50% mark.
     That's what keeps the sigil from ever clipping into a long intel list
     (2 fellow fascists + Hitler, in 9-10 player games) on short phones:
     the space it centers within shrinks along with the available room,
     instead of a fixed position ignoring how tall intel actually is. */
  .sigil-slot{flex:1; min-height:0; display:flex; align-items:center; justify-content:center}
  .card .sigil{width:108px; height:108px}
  .card .team{font-size:13px; letter-spacing:.25em; text-transform:uppercase; opacity:.85}
  .card .role{font-family:"Anton",sans-serif; font-size:clamp(46px,15vw,74px); text-transform:uppercase; line-height:.9; margin-top:6px}
  .card .stamp{
    align-self:flex-start; margin-top:14px; padding:6px 12px; font-family:"Anton";
    letter-spacing:.12em; text-transform:uppercase; font-size:13px;
    border:2px solid currentColor; border-radius:2px; transform:rotate(-3deg); opacity:.9;
  }
  .intel{margin-top:auto; padding-top:18px; border-top:1px solid rgba(255,255,255,.25)}
  .intel .label{color:inherit; opacity:.7}
  .intel ul{list-style:none; margin-top:8px; display:flex; flex-wrap:wrap; gap:8px}
  .intel li{background:rgba(0,0,0,.25); padding:8px 12px; border-radius:2px; font-weight:700}
  .intel p{margin-top:8px; font-size:15px; line-height:1.4}

  .foot{padding-top:14px; display:flex; gap:12px}
  .foot .btn{flex:1}
  .tiny{font-size:12px; color:var(--bone-dim); text-align:center; margin-top:12px; line-height:1.5}
  .dots{display:flex; gap:6px; justify-content:center; margin-top:16px}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--line)}
  .dot.on{background:var(--amber)}

  /* hold-to-redeal — a deliberately smaller, separate hold gesture (not the
     main reveal pad) so it can't be triggered by the same reflexive tap. */
  .redeal-hold{
    position:relative; overflow:hidden; padding:14px; align-self:stretch;
    border:2px solid var(--vermilion); border-radius:2px; text-align:center;
    user-select:none; touch-action:none;
  }
  .redeal-fill{
    position:absolute; inset:0; background:var(--vermilion); opacity:.3;
    transform:scaleX(0); transform-origin:left; transition:transform .05s linear;
  }
  .redeal-hold span{
    position:relative; z-index:2; color:var(--vermilion); font-weight:700;
    font-size:12px; letter-spacing:.1em; text-transform:uppercase;
  }

  /* name entry (setup) */
  .namefield{display:flex; align-items:center; gap:10px}
  .namefield .num{
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    background:var(--ink-2); border:2px solid var(--line); color:var(--bone-dim);
    font-family:"Anton",sans-serif; font-size:13px;
    display:flex; align-items:center; justify-content:center;
  }
  .namefield input{
    flex:1; background:var(--ink-2); border:2px solid var(--line); color:var(--bone);
    padding:12px 14px; border-radius:2px; font-family:"Archivo"; font-weight:700;
    font-size:15px;
  }
  .namefield input:focus{outline:none; border-color:var(--amber)}
  .namefield input::placeholder{color:var(--bone-dim); font-weight:500}

  /* target selection */
  .target-row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .target-cell{
    background:var(--ink-2); border:2px solid var(--line); color:var(--bone);
    padding:16px 12px; border-radius:2px; font-weight:900; font-size:15px;
    text-align:center; transition:transform .1s;
  }
  .target-cell:active{transform:translateY(2px)}
  /* Shared greyed-out treatment for any ineligible target — dead, or (when
     investigating) already investigated once this game. */
  .target-cell.out{opacity:.35; color:var(--bone-dim)}
  .target-cell.out span{
    display:block; font-size:10px; letter-spacing:.15em; text-transform:uppercase;
    margin-top:4px; font-family:"Archivo"; font-weight:700;
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ------------------------------------------------------------------ *
 * 1. GAME RULES  — the only part that encodes Secret Hitler itself.   *
 * ------------------------------------------------------------------ */

// non-Hitler fascists per player count; +1 Hitler always; rest are liberals
const ROLE_TABLE = {
  5:{fascists:1}, 6:{fascists:1},
  7:{fascists:2}, 8:{fascists:2},
  9:{fascists:3}, 10:{fascists:3},
};
// In 5–6 player games Hitler is told who the Fascist is. From 7 up, Hitler is blind.
const HITLER_KNOWS_MAX = 6;

function shuffle(a){                       // Fisher–Yates, unbiased
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// Returns players[] each with {name, role, team, intel} where intel is what
// this player learns during the night phase. This is the object you'd push to
// each phone in a multi-device version.
function dealRoles(names){
  const n = names.length;
  const cfg = ROLE_TABLE[n];
  const roles = [];
  for(let i=0;i<cfg.fascists;i++) roles.push("Fascist");
  roles.push("Hitler");
  while(roles.length < n) roles.push("Liberal");
  shuffle(roles);

  const players = names.map((name,i)=>({
    name, role:roles[i],
    team: roles[i]==="Liberal" ? "Liberal" : "Fascist",
  }));

  const fascists = players.filter(p=>p.role==="Fascist");
  const hitler   = players.find(p=>p.role==="Hitler");

  players.forEach(p=>{
    if(p.team==="Liberal"){
      p.intel = { text:"You know only yourself. Trust no one." };
    } else if(p.role==="Fascist"){
      const teammates = fascists.filter(f=>f!==p);
      p.intel = {
        knows: teammates.map(f=>f.name),
        hitler: hitler.name,
        text: teammates.length
          ? "You know your fellow Fascists — and who Hitler is."
          : "You're the only Fascist — but you know who Hitler is."
      };
    } else { // Hitler
      if(n <= HITLER_KNOWS_MAX){
        p.intel = { knows: fascists.map(f=>f.name),
          text:"Small game: you know your fellow Fascist." };
      } else {
        p.intel = { text:"You do NOT know who your Fascists are. They know you." };
      }
    }
  });
  return players;
}

/* ------------------------------------------------------------------ *
 * 2. APP STATE + RENDER                                              *
 * ------------------------------------------------------------------ */
const app = document.getElementById("app");
let state = {
  screen:"setup", nameFields:Array(10).fill(""), players:[], turn:0,
  revealed:false, action:null, target:null, winReason:null,
};

function set(patch){ Object.assign(state, patch); render(); }
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }

function resetGame(){
  // nameFields is deliberately left as-is: the host can quickly redeal the
  // same table for another round without retyping everyone's name.
  set({
    screen:"setup", players:[], turn:0,
    revealed:false, action:null, target:null, winReason:null,
  });
}

// Re-shuffles fresh roles for the SAME roster, mid reveal-phase — for when
// someone peeked at another player's card and the group needs to void every
// role assignment (not just restart the reveal sequence with the same,
// now-compromised roles) and start the reveal walk over from player 1.
function redeal(){
  const names = state.players.map(p=>p.name);
  const players = dealRoles(names).map(p=>({ ...p, dead:false, investigated:false }));
  set({
    players, turn:0, revealed:false,
    action:null, target:null, winReason:null, screen:"pass",
  });
}

function render(){
  app.innerHTML = "";
  app.appendChild(({
    setup:Setup, pass:Pass, reveal:Reveal, game:Game, target:Target,
    "investigate-result":InvestigateResult, "kill-result":KillResult,
    "liberals-win":LiberalsWin, "fascists-win":FascistsWin,
  })[state.screen]());
}

/* ---------- SETUP ---------- */
function Setup(){
  const field = i => {
    const val = state.nameFields[i] || "";
    return `<div class="namefield"><div class="num">${i+1}</div>
      <input type="text" maxlength="24" placeholder="Player ${i+1} name" data-i="${i}"
        value="${val.replace(/"/g,"&quot;")}" /></div>`;
  };
  const required = [0,1,2,3,4].map(field).join("");
  const optional = [5,6,7,8,9].map(field).join("");

  const s = el(`<div class="screen stack scroll">
    <div>
      <div class="eyebrow">Companion · pass &amp; reveal</div>
      <h1 class="wordmark">Secret<br>Role<br>Dealer<span class="rule"></span></h1>
    </div>
    <div class="label">Player names</div>
    <div class="stack" style="gap:10px">${required}</div>
    <div class="stack" style="gap:10px;border-top:2px dashed var(--line);padding-top:14px;margin-top:2px">
      <div class="label">Optional — up to 10 players</div>
      ${optional}
    </div>
    <div class="grow"></div>
    <div class="tiny">One phone, passed around the table. Each player privately
      holds to reveal their role, memorizes it, and passes on. Nothing is saved.</div>
    <button class="btn amber" id="deal">Deal roles</button>
  </div>`);

  const dealBtn = s.querySelector("#deal");
  const updateDealEnabled = () => {
    // Specifically the first 5 fields, not just "any 5 filled" — filling only
    // optional slots 6-10 shouldn't satisfy the requirement.
    dealBtn.disabled = !state.nameFields.slice(0,5).every(n=>n.trim().length>0);
  };
  updateDealEnabled();

  // Mutate state directly on keystroke rather than calling set() (which
  // re-renders the whole screen and would drop input focus every character).
  s.querySelectorAll("input[data-i]").forEach(inp=>{
    inp.oninput = () => {
      state.nameFields[+inp.dataset.i] = inp.value;
      updateDealEnabled();
    };
  });

  dealBtn.onclick = () => {
    const names = state.nameFields.map(n=>n.trim()).filter(Boolean);
    const players = dealRoles(names).map(p=>({ ...p, dead:false, investigated:false }));
    set({ players, turn:0, revealed:false, screen:"pass" });
  };
  return s;
}

/* ---------- PASS ---------- */
function Pass(){
  const p = state.players[state.turn];
  const dots = state.players.map((_,i)=>`<div class="dot ${i<state.turn?'on':''}"></div>`).join("");
  const s = el(`<div class="screen center">
    <div class="eyebrow">Player ${state.turn+1} of ${state.players.length}</div>
    <div class="emblem"><b>${state.turn+1}</b></div>
    <div class="who">${p.name}</div>
    <div class="tiny">Everyone else: look away.<br>Tap only when the phone is safely in your hands.</div>
    <div class="dots">${dots}</div>
    <button class="btn" id="go" style="align-self:stretch;margin-top:8px">I'm ${p.name} — reveal my role</button>
    <div class="redeal-hold" id="redealPad">
      <div class="redeal-fill" id="redealFill"></div>
      <span>Hold to redeal — someone peeked</span>
    </div>
  </div>`);
  s.querySelector("#go").onclick=()=>set({ screen:"reveal", revealed:false });

  // Same hold-to-confirm mechanic as the reveal pad, deliberately separate
  // and slightly longer, so it can't be triggered by a reflexive tap — this
  // voids every role assignment made so far, not just this player's.
  const rpad=s.querySelector("#redealPad"), rfill=s.querySelector("#redealFill");
  let rraf, rstart=0; const RDURATION=900;
  const rtick=t=>{ if(!rstart)rstart=t; const p=Math.min(1,(t-rstart)/RDURATION);
    rfill.style.transform=`scaleX(${p})`;
    if(p>=1){ if(navigator.vibrate)navigator.vibrate([30,40,30]); redeal(); return; }
    rraf=requestAnimationFrame(rtick); };
  const rdown=e=>{ e.preventDefault(); rstart=0; rraf=requestAnimationFrame(rtick); };
  const rup=()=>{ cancelAnimationFrame(rraf); rstart=0; rfill.style.transform="scaleX(0)"; };
  rpad.addEventListener("pointerdown",rdown);
  rpad.addEventListener("pointerup",rup);
  rpad.addEventListener("pointerleave",rup);
  rpad.addEventListener("pointercancel",rup);
  return s;
}

/* ---------- REVEAL (hold-to-show, then role card) ---------- */
function Reveal(){
  if(state.revealed) return RoleCard();

  const s = el(`<div class="screen stack">
    <div class="eyebrow">Hold to reveal</div>
    <div class="holdpad" id="pad">
      <div class="fill" id="fill"></div>
      <div class="hint"><b>PRESS &amp; HOLD</b><span>Keep your thumb down until the card appears</span></div>
    </div>
    <button class="btn ghost" id="back">Not me — go back</button>
  </div>`);

  const pad=s.querySelector("#pad"), fill=s.querySelector("#fill");
  let raf, start=0; const DURATION=750;
  const tick=t=>{ if(!start)start=t; const p=Math.min(1,(t-start)/DURATION);
    fill.style.transform=`scaleY(${p})`;
    if(p>=1){ if(navigator.vibrate)navigator.vibrate(30); set({revealed:true}); return; }
    raf=requestAnimationFrame(tick); };
  const down=e=>{ e.preventDefault(); start=0; raf=requestAnimationFrame(tick); };
  const up=()=>{ cancelAnimationFrame(raf); start=0; fill.style.transform="scaleY(0)"; };
  pad.addEventListener("pointerdown",down);
  pad.addEventListener("pointerup",up);
  pad.addEventListener("pointerleave",up);
  pad.addEventListener("pointercancel",up);
  s.querySelector("#back").onclick=()=>set({screen:"pass"});
  return s;
}

// Party sigils — the actual Party Membership card art from the Print & Play
// (dove-in-laurel for Liberal, skull-and-snake for Fascist). The originals
// (liberalSigil.png / fascistSigil.png) are opaque with a baked-in white
// background, not real transparency, and CSS `color` can't recolor a raster
// image — so process_sigils.py pre-bakes both the tint and a proper alpha
// cutout into *-tinted.png, which is what actually gets used here. Used
// instead of a full-bleed card background so a glance at the phone's
// reflection can't out a player.
function sigilSvg(team, extraClass){
  const cls = `sigil ${team==="Liberal"?"liberal":"fascist"}${extraClass?" "+extraClass:""}`;
  const src = team==="Liberal" ? "liberalSigil-tinted.png" : "fascistSigil-tinted.png";
  return `<img class="${cls}" src="${src}" alt="${team} party sigil" draggable="false" />`;
}

function RoleCard(){
  const p = state.players[state.turn];
  const fascist = p.team==="Fascist";
  const last = state.turn === state.players.length-1;

  let intelHtml = `<p>${p.intel.text}</p>`;
  if(p.intel.knows && p.intel.knows.length)
    intelHtml += `<div class="label" style="margin-top:12px">Fellow fascists</div>
      <ul>${p.intel.knows.map(n=>`<li>${n}</li>`).join("")}</ul>`;
  if(p.intel.hitler)
    intelHtml += `<div class="label" style="margin-top:12px">Hitler is</div>
      <ul><li>${p.intel.hitler}</li></ul>`;

  const s = el(`<div class="screen stack">
    <div class="card">
      <div class="team">${p.team} Party</div>
      <div class="role">${p.role}</div>
      <div class="stamp">${fascist?'Loyalty · Fascist':'Loyalty · Liberal'}</div>
      <div class="sigil-slot">${sigilSvg(p.team)}</div>
      <div class="intel">
        <div class="label">Night phase</div>
        ${intelHtml}
      </div>
    </div>
    <button class="btn amber" id="next">Memorized — ${last?'start the game':'pass to next player'}</button>
    <div class="tiny">Cover the screen before you hand it back.</div>
  </div>`);
  s.querySelector("#next").onclick=()=>{
    if(last) set({screen:"game"});
    else set({turn:state.turn+1, revealed:false, screen:"pass"});
  };
  return s;
}

/* ---------- GAME ---------- *
 * Investigate/Execute are surfaced here unconditionally as manual actions
 * for the President to trigger. Gating them by actual game state (policies
 * enacted, player-count thresholds, one-use-per-term limits) is a future
 * enhancement — this app doesn't track the policy tracker yet.           */
function Game(){
  const alive = state.players.filter(p=>!p.dead).length;
  const s = el(`<div class="screen stack">
    <div>
      <div class="eyebrow">In session</div>
      <h1 style="font-size:34px">The<br>Presidency</h1>
    </div>
    <div class="tiny">${alive} of ${state.players.length} players still in the game.</div>
    <div class="grow"></div>
    <div class="label" style="text-align:center">Fascist powers</div>
    <div class="stack">
      <button class="btn amber" id="investigate">Investigate loyalty</button>
      <button class="btn" id="kill">Execute</button>
    </div>
    <div class="grow"></div>
    <div class="foot">
      <button class="btn ghost" id="liberals-win-btn" style="border-color:var(--liberal); color:var(--liberal)">Liberals win</button>
      <button class="btn ghost" id="fascists-win-btn" style="border-color:var(--vermilion); color:var(--vermilion)">Fascists win</button>
    </div>
  </div>`);
  s.querySelector("#investigate").onclick=()=>set({screen:"target", action:"investigate", target:null});
  s.querySelector("#kill").onclick=()=>set({screen:"target", action:"kill", target:null});
  // Manual escape hatches: this app doesn't track the policy tracker or
  // elections, so it can't detect the win conditions that don't route
  // through Investigate/Execute (5 Liberal policies; 6 Fascist policies;
  // Hitler elected Chancellor after the 3rd Fascist policy). The table
  // declares those itself.
  s.querySelector("#liberals-win-btn").onclick=()=>set({screen:"liberals-win", winReason:"manual"});
  s.querySelector("#fascists-win-btn").onclick=()=>set({screen:"fascists-win"});
  return s;
}

/* ---------- TARGET SELECTION ---------- */
function Target(){
  const verb = state.action==="kill" ? "Execute" : "Investigate";
  // "No player may be investigated twice in the same game" — only bites
  // during Investigate; a prior investigation doesn't protect someone from
  // execution.
  const cell = (p,idx) => {
    if(!p) return `<div></div>`;
    const alreadyChecked = state.action==="investigate" && p.investigated;
    const out = p.dead || alreadyChecked;
    const marker = p.dead ? "eliminated" : (alreadyChecked ? "already investigated" : "");
    return `<button class="target-cell ${out?'out':''}" data-idx="${idx}" ${out?'disabled':''}>
      ${p.name}${marker?`<span>${marker}</span>`:''}</button>`;
  };

  const rows = [];
  for(let i=0;i<state.players.length;i+=2) rows.push(`<div class="target-row">
    ${cell(state.players[i],i)}${cell(state.players[i+1],i+1)}</div>`);

  const s = el(`<div class="screen stack">
    <div class="eyebrow">${verb} — choose a target</div>
    <div class="stack" style="gap:10px">${rows.join("")}</div>
    <div class="grow"></div>
    <button class="btn ghost" id="cancel">Cancel</button>
  </div>`);

  s.querySelectorAll(".target-cell:not([disabled])").forEach(btn=>{
    btn.onclick=()=>{
      const target = state.players[+btn.dataset.idx];
      if(state.action==="kill"){
        target.dead = true;
        set({screen:"kill-result", target});
      } else {
        target.investigated = true;
        set({screen:"investigate-result", target});
      }
    };
  });
  s.querySelector("#cancel").onclick=()=>set({screen:"game", action:null});
  return s;
}

/* ---------- INVESTIGATE RESULT ---------- */
function InvestigateResult(){
  const t = state.target;
  const s = el(`<div class="screen stack">
    <div class="card">
      <div class="team">${t.name} is a...</div>
      <div class="role">${t.team}</div>
      <div class="stamp">Party membership revealed</div>
      <div class="sigil-slot">${sigilSvg(t.team)}</div>
    </div>
    <button class="btn amber" id="done">Done</button>
  </div>`);
  s.querySelector("#done").onclick=()=>set({screen:"game", action:null, target:null});
  return s;
}

/* ---------- KILL RESULT ---------- */
function KillResult(){
  const t = state.target;
  const isHitler = t.role==="Hitler";
  // No sigil here, on purpose — an execution only ever reveals Hitler-or-not,
  // never the target's party, so nothing on this card can key off t.team.
  const s = el(`<div class="screen stack">
    <div class="card">
      <div class="team">Execution result</div>
      <div class="who" style="margin-top:14px">${t.name}</div>
      <div class="role" style="margin-top:6px">${isHitler?'Was Hitler!':'Not Hitler'}</div>
      <div class="stamp">${isHitler?'Game over':'Eliminated'}</div>
    </div>
    <button class="btn amber" id="done">${isHitler?'Continue':'Done'}</button>
  </div>`);
  s.querySelector("#done").onclick=()=>{
    if(isHitler) set({screen:"liberals-win", winReason:"execution"});
    else set({screen:"game", action:null, target:null});
  };
  return s;
}

/* ---------- LIBERALS WIN ---------- */
function LiberalsWin(){
  const subtitle = state.winReason==="execution"
    ? "Hitler was executed. The Fascist plot collapses."
    : "Declared by the table.";
  const s = el(`<div class="screen center">
    <div class="eyebrow">Game over</div>
    ${sigilSvg("Liberal","hero")}
    <h1 style="font-size:38px">Liberals<br>Win</h1>
    <div class="tiny">${subtitle}</div>
    <div class="foot" style="align-self:stretch">
      <button class="btn amber" id="again">New game</button>
    </div>
  </div>`);
  s.querySelector("#again").onclick=()=>resetGame();
  return s;
}

/* ---------- FASCISTS WIN ---------- */
function FascistsWin(){
  const s = el(`<div class="screen center">
    <div class="eyebrow">Game over</div>
    ${sigilSvg("Fascist","hero")}
    <h1 style="font-size:38px">Fascists<br>Win</h1>
    <div class="tiny">Declared by the table — six Fascist policies enacted,
      or Hitler elected Chancellor.</div>
    <div class="foot" style="align-self:stretch">
      <button class="btn amber" id="again">New game</button>
    </div>
  </div>`);
  s.querySelector("#again").onclick=()=>resetGame();
  return s;
}

render();
</script>
</body>
</html>
